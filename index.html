<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" href="img/logo.png">

</head>

<body>

    <form>

        <fieldset>

            <legend>Calculadora</legend>

            <div class="numeros">

                <div class="campos">

                    <label for="numero1">Primeiro número</label>

                    <input type="number" id="numero1">

                </div>

                <div class="campos">

                    <label for="numero2">Segundo número</label>

                    <input type="number" id="numero2">

                </div>

            </div>

            <div class="botoes">

                <input type="button" value="Soma" id="soma">

                <input type="button" value="Subtração" id="subtracao">

                <input type="button" value="Multiplicação" id="multiplicacao">

                <input type="button" value="Divisão" id="divisao">

            </div>

            <div class="resultado">

                <p>Resultado: <span id="resultado">0</span></p>

            </div>

        </fieldset>

    </form>

    <script src="js/script.js"></script>

</body>

</html>
